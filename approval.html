<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AVE Security — Contract Checker</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --green:   #2DD4BF;
    --purple:  #8B5CF6;
    --grad:    linear-gradient(135deg, #2DD4BF 0%, #8B5CF6 100%);
    --bg:      #07090F;
    --surface: #0E1522;
    --surface2:#111B2E;
    --border:  #1A2640;
    --border2: #243050;
    --text:    #E2E8F0;
    --muted:   #4A5B7A;
    --dim:     #2A3A55;
  }

  body.light {
    --bg:      #F8FAFC;
    --surface: #FFFFFF;
    --surface2:#F1F5F9;
    --border:  #E2E8F0;
    --border2: #CBD5E1;
    --text:    #0F172A;
    --muted:   #64748B;
    --dim:     #CBD5E1;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.5;
    transition: background .2s, color .2s;
  }

  /* ── Nav ── */
  nav {
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    height: 56px;
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(7,9,15,.9);
    backdrop-filter: blur(12px);
    position: sticky;
    top: 0;
    z-index: 100;
    transition: background .2s;
  }
  body.light nav { background: rgba(248,250,252,.95); }
  nav img.logo { width: 28px; height: 28px; object-fit: contain; }
  nav .brand { font-size: 15px; font-weight: 700; letter-spacing: -.2px; }
  nav .brand span { background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  nav .badge { font-size: 9px; font-weight: 600; padding: 2px 7px; border-radius: 999px; border: 1px solid var(--border2); color: var(--muted); letter-spacing: .5px; text-transform: uppercase; }
  nav .spacer { flex: 1; }
  .nav-btn {
    background: var(--surface); border: 1px solid var(--border2); border-radius: 8px;
    color: var(--muted); font-size: 12px; font-weight: 600; padding: 5px 12px;
    cursor: pointer; transition: color .15s, border-color .15s, background .2s;
    display: flex; align-items: center; gap: 5px;
    white-space: nowrap; font-family: inherit; line-height: 1;
  }
  .nav-btn:hover { color: var(--text); border-color: var(--muted); }
  .nav-btn.icon-btn { padding: 6px 9px; }

  /* ── Hero ── */
  .hero { max-width: 760px; margin: 36px auto 24px; padding: 0 20px; text-align: center; }
  .hero-label { font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: .5px; text-transform: uppercase; margin-bottom: 8px; }
  .hero h1 { font-size: 15px; font-weight: 600; color: var(--muted); word-break: break-all; font-family: 'SFMono-Regular', Consolas, monospace; }
  .hero .chain-pill {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--surface2); border: 1px solid var(--border2);
    border-radius: 999px; padding: 3px 12px;
    font-size: 12px; font-weight: 600; color: var(--text);
    margin-top: 10px;
  }
  .chain-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

  /* ── No params ── */
  .no-params { max-width: 440px; margin: 80px auto; text-align: center; color: var(--muted); font-size: 14px; line-height: 1.7; }
  .no-params code { font-size: 12px; background: var(--surface2); padding: 2px 7px; border-radius: 5px; color: var(--text); }

  /* ── Spinner ── */
  .spinner { display: inline-block; width: 13px; height: 13px; border: 2px solid rgba(255,255,255,.2); border-top-color: #8B5CF6; border-radius: 50%; animation: spin .65s linear infinite; vertical-align: middle; margin-right: 7px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Main ── */
  .main { max-width: 760px; margin: 0 auto; padding: 0 20px 80px; }
  #result { display: none; margin-top: 4px; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 22px 24px; margin-bottom: 12px; transition: background .2s; }

  /* ── Score card ── */
  .score-card { padding: 24px; }
  .score-top { display: flex; align-items: flex-start; gap: 20px; margin-bottom: 20px; }
  .score-circle {
    flex-shrink: 0; width: 86px; height: 86px; border-radius: 50%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2px; border: 3px solid;
  }
  .score-circle.safe   { border-color: #2DD4BF; background: rgba(45,212,191,.07); }
  .score-circle.risky  { border-color: #FB923C; background: rgba(249,115,22,.07); }
  .score-circle.danger { border-color: #F87171; background: rgba(239,68,68,.07); }
  .score-circle .score-num { font-size: 26px; font-weight: 800; line-height: 1; }
  .score-circle.safe   .score-num { color: #2DD4BF; }
  .score-circle.risky  .score-num { color: #FB923C; }
  .score-circle.danger .score-num { color: #F87171; }
  .score-circle .score-label { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); }

  .score-meta { flex: 1; min-width: 0; }
  .score-name { font-size: 18px; font-weight: 700; letter-spacing: -.2px; margin-bottom: 6px; word-break: break-all; }
  .score-addr { font-size: 12px; color: var(--muted); font-family: monospace; margin-bottom: 10px; word-break: break-all; }
  .score-flags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .flag { font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 999px; border: 1px solid; letter-spacing: .3px; }
  .flag.danger  { color: #F87171; border-color: rgba(239,68,68,.4);   background: rgba(239,68,68,.08); }
  .flag.warning { color: #FB923C; border-color: rgba(249,115,22,.4);  background: rgba(249,115,22,.08); }
  .flag.safe    { color: #2DD4BF; border-color: rgba(45,212,191,.4);  background: rgba(45,212,191,.08); }
  .flag.info    { color: #60A5FA; border-color: rgba(96,165,250,.4);  background: rgba(96,165,250,.08); }

  .risk-label-text { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 4px; }
  .risk-label-text.safe   { color: #2DD4BF; }
  .risk-label-text.risky  { color: #FB923C; }
  .risk-label-text.danger { color: #F87171; }

  /* ── Score bar ── */
  .score-bar-wrap { margin-top: 4px; }
  .score-bar-track { height: 5px; border-radius: 99px; background: var(--border2); overflow: hidden; }
  .score-bar-fill { height: 100%; border-radius: 99px; transition: width .4s ease; }
  .score-bar-fill.safe   { background: linear-gradient(90deg, #2DD4BF, #22D3EE); }
  .score-bar-fill.risky  { background: linear-gradient(90deg, #F59E0B, #FB923C); }
  .score-bar-fill.danger { background: linear-gradient(90deg, #FB923C, #F87171); }
  .score-bar-labels { display: flex; justify-content: space-between; font-size: 9px; color: var(--muted); margin-top: 3px; }

  /* ── Summary ── */
  .summary-block { border-top: 1px solid var(--border); padding-top: 18px; }
  .summary-text { font-size: 14px; color: #94A3B8; line-height: 1.75; }
  body.light .summary-text { color: #475569; }

  /* ── Signal chips ── */
  .signals-row { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--border); }
  .signal-chip { display: flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 7px; font-size: 11px; font-weight: 500; border: 1px solid; }
  .signal-chip.crit  { background: rgba(239,68,68,.07);  border-color: rgba(239,68,68,.2);  color: #F87171; }
  .signal-chip.high  { background: rgba(249,115,22,.07); border-color: rgba(249,115,22,.2); color: #FB923C; }
  .signal-chip.low   { background: rgba(245,158,11,.07); border-color: rgba(245,158,11,.2); color: #F59E0B; }
  .signal-chip.info  { background: rgba(96,165,250,.07); border-color: rgba(96,165,250,.2); color: #60A5FA; }
  .signal-chip.good  { background: rgba(45,212,191,.07); border-color: rgba(45,212,191,.2); color: #2DD4BF; }

  /* ── Contract metadata row ── */
  .meta-row { display: flex; gap: 0; flex-wrap: wrap; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }
  .meta-item { flex: 1; min-width: 120px; padding: 0 16px 0 0; margin-bottom: 10px; }
  .meta-item:first-child { padding-left: 0; }
  .meta-key { font-size: 10px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 4px; }
  .meta-val { font-size: 13px; font-weight: 600; color: var(--text); }
  .meta-val.mono { font-family: monospace; font-size: 12px; }
  .meta-val.green { color: #2DD4BF; }
  .meta-val.red   { color: #F87171; }
  .meta-val.muted { color: var(--muted); }

  /* ── Section heading ── */
  .section-head { font-size: 11px; font-weight: 600; letter-spacing: .8px; text-transform: uppercase; color: var(--muted); margin-bottom: 14px; display: flex; align-items: center; gap: 10px; }
  .section-head::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  /* ── Risk items ── */
  .risk-item { background: var(--bg); border: 1px solid var(--border); border-left: 3px solid; border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; transition: background .2s; }
  .risk-item:last-child { margin-bottom: 0; }
  .risk-item.critical { border-left-color: #F87171; }
  .risk-item.high     { border-left-color: #FB923C; }
  .risk-item.low      { border-left-color: #F59E0B; }
  .risk-item.info     { border-left-color: #60A5FA; }

  .item-top { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
  .sev-pill { font-size: 9px; font-weight: 700; padding: 3px 8px; border-radius: 999px; text-transform: uppercase; letter-spacing: .5px; flex-shrink: 0; margin-top: 2px; }
  .sev-pill.critical { background: rgba(239,68,68,.15);  color: #F87171; }
  .sev-pill.high     { background: rgba(249,115,22,.15); color: #FB923C; }
  .sev-pill.low      { background: rgba(245,158,11,.15); color: #F59E0B; }
  .sev-pill.info     { background: rgba(96,165,250,.15); color: #60A5FA; }

  .item-title { font-size: 13px; font-weight: 600; color: var(--text); line-height: 1.4; }
  .item-divider { border: none; border-top: 1px solid var(--border); margin: 10px 0; }
  .item-desc { font-size: 13px; color: #94A3B8; line-height: 1.7; }
  body.light .item-desc { color: #475569; }

  /* Error */
  .error-card { background: rgba(239,68,68,.06); border: 1px solid rgba(239,68,68,.25); border-radius: 12px; padding: 16px 20px; color: #F87171; font-size: 14px; margin-top: 20px; }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--dim); border-radius: 2px; }

  /* ── Mobile ── */
  @media (max-width: 600px) {
    nav { padding: 0 16px; gap: 8px; height: 52px; }
    nav .badge { display: none; }
    .hero { margin: 20px auto 16px; padding: 0 16px; }
    .hero h1 { font-size: 12px; }
    .main { padding: 0 16px 60px; }
    .card { padding: 16px; border-radius: 12px; }
    .score-card { padding: 16px; }
    .score-top { gap: 14px; }
    .score-circle { width: 72px; height: 72px; }
    .score-circle .score-num { font-size: 22px; }
    .score-name { font-size: 15px; }
    .signals-row { gap: 6px; }
    .signal-chip { font-size: 10px; padding: 3px 8px; }
    .item-title { font-size: 12px; }
    .item-desc { font-size: 12px; }
    .summary-text { font-size: 13px; }
    .meta-item { min-width: 100px; }
  }
</style>
</head>
<body>

<nav>
  <img class="logo" src="logo.png" alt="AVE" onerror="this.style.display='none'">
  <div class="brand"><span>AVE</span> Security</div>

<div class="hero" id="hero" style="display:none">

      description: 'The owner can mint an unlimited supply of tokens, diluting value and enabling rug pulls.',
      description_zh: '所有者可无限铸造代币，稀释价值并可能实施跑路诈骗。' },
    { risk_item: 'Very Young Contract (< 30 days)', risk_item_zh: '极新合约（<30天）', severity: 'low',
      description: 'Deployed only recently with minimal transaction history. Insufficient track record to establish trust.',
      description_zh: '合约最近才部署，交易历史极少，尚无足够记录建立信任。' },
  ],
};

function toScore(data) {
  return { 1: 20, 2: 80, 3: 100 }[data.status] ?? 20;
}
function scoreClass(s) { return s <= 20 ? 'safe' : s < 100 ? 'risky' : 'danger'; }

let lang = localStorage.getItem('lang') || 'en';
let lastData = null;

function L() { return LANGS[lang]; }

function getParams() {
  const sp = new URLSearchParams(window.location.search);
  return {
    chain:    (sp.get('chain') || '').toLowerCase(),
    contract: sp.get('contract') || '',
    mock:     sp.get('mock') || '',
  };
}

function shorten(addr, h = 8, t = 6) {
  if (!addr || addr.length <= h + t + 3) return addr || '';
  return addr.slice(0, h) + '…' + addr.slice(-t);
}

function getChain(c) {
  return CHAINS[c] || { name: c.toUpperCase(), symbol: c.toUpperCase(), color: '#8B5CF6', explorer: '#' };
}

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function applyLang() {
  document.getElementById('lang-btn').textContent = L().langSwitch;
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  const lbl = document.getElementById('hero-label');
  if (lbl) lbl.textContent = L().heroLabel;
}

function toggleLang() {
  lang = lang === 'en' ? 'zh' : 'en';
  localStorage.setItem('lang', lang);
  applyLang();
  if (lastData) renderResult(lastData);
}

function toggleTheme() {
  const isLight = document.body.classList.toggle('light');
  localStorage.setItem('theme', isLight ? 'light' : 'dark');
  document.getElementById('theme-btn').innerHTML = isLight ? MOON_SVG : SUN_SVG;
}

const SEV_ICON = {
  critical: `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`,
  high:     `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`,
  low:      `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`,
  info:     `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>`,
};

function sevChipClass(s) { return { critical:'crit', high:'high', low:'low', info:'info' }[s] || 'info'; }

function renderResult(data) {
  lastData = data;
  const { chain, contract } = getParams();
  const chainInfo = getChain(chain);
  const t = L();

  document.getElementById('hero-label').textContent = t.heroLabel;

  const items  = data.risk_items || [];
  const score  = toScore(data);
  const sc     = scoreClass(score);

  // Verdict flag
  let verdictFlag;
  if (sc === 'danger' || data.is_malicious) {
    verdictFlag = `<span class="flag danger">${t.danger}</span>`;
  } else if (sc === 'risky') {
    verdictFlag = `<span class="flag warning">${t.warning}</span>`;
  } else {
    verdictFlag = `<span class="flag safe">${t.safe}</span>`;
  }

  // Verified flag
  const verifiedFlag = data.is_open_source
    ? `<span class="flag safe">${t.verified}</span>`
    : `<span class="flag danger">${t.unverified}</span>`;

  // Known protocol badge
  const protocolFlag = data.is_known_protocol && data.protocol_name
    ? `<span class="flag info">✦ ${esc(data.protocol_name)}</span>`
    : '';

  // Signal chips from contract flags
  const CONTRACT_FLAGS = [
    [data.is_honeypot,               'crit', '🍯 Honeypot'],
    [data.can_take_back_ownership,   'crit', 'Owner Takeback'],
    [!data.is_open_source,           'crit', 'Unverified Source'],
    [data.is_proxy,                  'high', 'Upgradeable Proxy'],
    [data.has_blacklist,             'high', 'Blacklist Function'],
    [data.is_mintable,               'high', 'Mint Function'],
    [Number(data.sell_tax) > 10,     'high', `Sell Tax ${data.sell_tax}%`],
    [Number(data.buy_tax) > 10,      'low',  `Buy Tax ${data.buy_tax}%`],
    [data.has_whitelist,             'low',  'Whitelist Gating'],
    [data.is_known_protocol,         'good', `Known: ${data.protocol_name || 'Protocol'}`],
    [data.audit_info,                'good', `Audited`],
    [data.is_open_source && !data.is_proxy && !data.can_take_back_ownership, 'good', 'Open Source'],
  ];

  const chips = CONTRACT_FLAGS
    .filter(([cond]) => cond)
    .map(([, cls, label]) =>
      `<span class="signal-chip ${cls}">${SEV_ICON[cls === 'crit' ? 'critical' : cls === 'high' ? 'high' : 'info'] || ''}${esc(label)}</span>`
    ).join('');

  // Owner display
  const isRenounced = !data.owner_address || data.owner_address === '0x0000000000000000000000000000000000000000';
  const ownerDisplay = isRenounced ? `<span class="meta-val green">${t.renounced}</span>` : `<span class="meta-val mono red">${shorten(data.owner_address, 6, 4)}</span>`;

  // Tx count display
  const txDisplay = data.tx_count != null
    ? (data.tx_count > 1e6 ? (data.tx_count/1e6).toFixed(1)+'M' : data.tx_count.toLocaleString())
    : '—';

  // Risk items
  const riskHtml = items.length
    ? `<div class="card">
        <div class="section-head">${t.riskSection(items.length)}</div>
        ${items.map(item => {
          const sev = item.severity || 'info';
          const title    = lang === 'zh' ? (item.risk_item_zh    || item.risk_item)    : item.risk_item;
          const desc     = lang === 'zh' ? (item.description_zh  || item.description)  : item.description;
          return `<div class="risk-item ${sev}">
            <div class="item-top">
              <span class="sev-pill ${sev}">${t.severity[sev] || sev}</span>
              <span class="item-title">${esc(title)}</span>
            </div>
            ${desc ? `<hr class="item-divider"><p class="item-desc">${esc(desc)}</p>` : ''}
          </div>`;
        }).join('')}
      </div>`
    : `<div class="card"><p style="color:var(--muted);font-size:14px">${t.noRisk}</p></div>`;

  const summary = lang === 'zh' ? (data.summary_zh || data.summary) : data.summary;
  const contractName = data.contract_name || shorten(contract, 10, 8);

  document.getElementById('result').style.display = 'block';
  document.getElementById('result').innerHTML = `
    <div class="card score-card">
      <div class="score-top">
        <div class="score-circle ${sc}">
          <span class="score-num">${score}</span>
          <span class="score-label">/100</span>
        </div>
        <div class="score-meta">
          <div class="score-name">${esc(contractName)}</div>
          <div class="score-addr">${esc(contract)}</div>
          <div class="score-flags">
            ${verdictFlag}
            ${verifiedFlag}
            ${protocolFlag}
          </div>
          <div class="risk-label-text ${sc}">${t.riskLabel[sc]}</div>
          <div class="score-bar-wrap">
            <div class="score-bar-track">
              <div class="score-bar-fill ${sc}" style="width:${score}%"></div>
            </div>
            <div class="score-bar-labels"><span>0</span><span>55 ${t.scoreNormal}</span><span>100 ${t.scoreRisky}</span></div>
          </div>
        </div>
      </div>

      ${chips ? `<div class="signals-row">${chips}</div>` : ''}

      <div class="meta-row">
        <div class="meta-item">
          <div class="meta-key">${t.metaChain}</div>
          <div class="meta-val">${esc(chainInfo.name)}</div>
        </div>
        <div class="meta-item">
          <div class="meta-key">${t.metaOwner}</div>
          ${ownerDisplay}
        </div>
        ${data.approval_count != null ? `<div class="meta-item">
          <div class="meta-key">${t.metaApprovals}</div>
          <div class="meta-val">${Number(data.approval_count).toLocaleString()}</div>
        </div>` : ''}
        ${data.deploy_time ? `<div class="meta-item">
          <div class="meta-key">${t.metaDeployed}</div>
          <div class="meta-val">${esc(data.deploy_time)}</div>
        </div>` : ''}
        ${data.tx_count != null ? `<div class="meta-item">
          <div class="meta-key">${t.metaTxCount}</div>
          <div class="meta-val">${txDisplay}</div>
        </div>` : ''}
      </div>

      ${summary ? `<div class="summary-block"><p class="summary-text">${esc(summary)}</p></div>` : ''}
    </div>

    ${riskHtml}
  `;
}

async function load() {
  const { chain, contract, mock } = getParams();
  const result = document.getElementById('result');

  if (!chain || !contract) {
    result.style.display = 'block';
    result.innerHTML = `<div class="no-params"><p><strong>${L().noParams}</strong></p><p>${L().noParamsDesc}</p></div>`;
    return;
  }

  // Show hero
  document.getElementById('hero').style.display = 'block';
  document.getElementById('hero-addr').textContent = shorten(contract, 10, 8);
  const chainInfo = getChain(chain);
  document.getElementById('hero-chain').innerHTML = `
    <span class="chain-pill">
      <span class="chain-dot" style="background:${chainInfo.color}"></span>
      ${esc(chainInfo.name)} (${esc(chainInfo.symbol)})
    </span>`;
  document.title = `${shorten(contract, 8, 6)} — AVE Security`;

  result.style.display = 'block';
  result.innerHTML = `<div style="text-align:center;padding:48px 0;color:var(--muted);font-size:14px"><span class="spinner"></span>${L().loading}</div>`;

  // Mock mode
  if (mock === '1' || mock === 'safe') {
    await new Promise(r => setTimeout(r, 700));
    renderResult(MOCK_SAFE);
    return;
  }
  if (mock === 'risky') {
    await new Promise(r => setTimeout(r, 700));
    renderResult(MOCK_RISKY);
    return;
  }

  try {
    const keyword = `${contract}-${chain}`;
    const url = `${API_BASE}?keyword=${encodeURIComponent(keyword)}`;
    const auth = localStorage.getItem('auth');
    const config = auth ? { headers: { 'X-Auth': auth } } : {};
    const res  = await fetch(url, config);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const json = await res.json();
    if (json.status !== 1) throw new Error(json.msg || 'API error');
    if (!json.data) throw new Error('Not scanned yet');
    const scan = json.data.security_scan ?? json.data;
    renderResult({ ...scan, status: json.data.status });
  } catch (e) {
    result.innerHTML = `<div class="error-card"><strong>Error:</strong> ${esc(e.message)}</div>`;
  }
}

(function init() {
  // Read auth from URL params and store to localStorage
  const urlAuth = new URLSearchParams(window.location.search).get('auth');
  if (urlAuth) localStorage.setItem('auth', urlAuth);

  if (localStorage.getItem('theme') === 'light') {
    document.body.classList.add('light');
    document.getElementById('theme-btn').innerHTML = MOON_SVG;
  } else {
    document.getElementById('theme-btn').innerHTML = SUN_SVG;
  }
  if (localStorage.getItem('lang') === 'zh') lang = 'zh';
  applyLang();
  load();
})();
</script>
</body>
</html>
