<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AVE Security — DApp Scanner</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --green:   #2DD4BF;
    --purple:  #8B5CF6;
    --grad:    linear-gradient(135deg, #2DD4BF 0%, #8B5CF6 100%);
    --bg:      #07090F;
    --surface: #0E1522;
    --surface2:#111B2E;
    --border:  #1A2640;
    --border2: #243050;
    --text:    #E2E8F0;
    --muted:   #4A5B7A;
    --dim:     #2A3A55;
  }

  body.light {
    --bg:      #F8FAFC;
    --surface: #FFFFFF;
    --surface2:#F1F5F9;
    --border:  #E2E8F0;
    --border2: #CBD5E1;
    --text:    #0F172A;
    --muted:   #64748B;
    --dim:     #CBD5E1;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.5;
    transition: background .2s, color .2s;
  }

  /* ── Nav ── */
  nav {
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    height: 56px;
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(7,9,15,.9);
    backdrop-filter: blur(12px);
    position: sticky;
    top: 0;
    z-index: 100;
    transition: background .2s;
  }
  body.light nav { background: rgba(248,250,252,.95); }
  nav img.logo { width: 28px; height: 28px; object-fit: contain; }
  nav .brand { font-size: 15px; font-weight: 700; letter-spacing: -.2px; }
  nav .brand span { background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  nav .badge { font-size: 9px; font-weight: 600; padding: 2px 7px; border-radius: 999px; border: 1px solid var(--border2); color: var(--muted); letter-spacing: .5px; text-transform: uppercase; }
  nav .spacer { flex: 1; }

  .nav-btn {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 8px;
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
    padding: 5px 12px;
    cursor: pointer;
    transition: color .15s, border-color .15s, background .2s;
    display: flex;
    align-items: center;
    gap: 5px;
    white-space: nowrap;
    font-family: inherit;
    line-height: 1;
  }
  .nav-btn:hover { color: var(--text); border-color: var(--muted); }
  .nav-btn.icon-btn { padding: 6px 9px; }

  /* ── Hero ── */
  .hero { max-width: 720px; margin: 40px auto 28px; padding: 0 20px; text-align: center; }
  .hero-label { font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: .5px; text-transform: uppercase; margin-bottom: 8px; }
  .hero h1 { font-size: 28px; font-weight: 700; letter-spacing: -.5px; line-height: 1.2; word-break: break-all; }
  .hero h1 .grad { background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

  /* ── No keyword ── */
  .no-keyword { max-width: 440px; margin: 80px auto; text-align: center; color: var(--muted); font-size: 14px; line-height: 1.7; }
  .no-keyword code { font-size: 12px; background: var(--surface2); padding: 2px 7px; border-radius: 5px; color: var(--text); }

  /* ── Spinner ── */
  .spinner { display: inline-block; width: 13px; height: 13px; border: 2px solid rgba(255,255,255,.25); border-top-color: #fff; border-radius: 50%; animation: spin .65s linear infinite; vertical-align: middle; margin-right: 7px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Main ── */
  .main { max-width: 720px; margin: 0 auto; padding: 0 20px 80px; }

  /* ── Result ── */
  #result { display: none; margin-top: 20px; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 22px 24px; margin-bottom: 12px; transition: background .2s; }

  /* ── Score card ── */
  .score-card { padding: 24px; }
  .score-top { display: flex; align-items: flex-start; gap: 20px; margin-bottom: 20px; }
  .score-circle {
    flex-shrink: 0;
    width: 86px; height: 86px;
    border-radius: 50%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2px;
    border: 3px solid;
  }
  .score-circle.safe   { border-color: #2DD4BF; background: rgba(45,212,191,.07); }
  .score-circle.risky  { border-color: #FB923C; background: rgba(249,115,22,.07); }
  .score-circle.danger { border-color: #F87171; background: rgba(239,68,68,.07); }
  .score-circle .score-num { font-size: 26px; font-weight: 800; line-height: 1; }
  .score-circle.safe   .score-num { color: #2DD4BF; }
  .score-circle.risky  .score-num { color: #FB923C; }
  .score-circle.danger .score-num { color: #F87171; }
  .score-circle .score-label { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); }

  .score-meta { flex: 1; min-width: 0; }
  .score-domain { font-size: 20px; font-weight: 700; letter-spacing: -.3px; margin-bottom: 6px; word-break: break-all; }
  .score-flags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .flag { font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 999px; border: 1px solid; letter-spacing: .3px; }
  .flag.phishing { color: #F87171; border-color: rgba(239,68,68,.4); background: rgba(239,68,68,.08); }
  .flag.scam     { color: #FB923C; border-color: rgba(249,115,22,.4); background: rgba(249,115,22,.08); }
  .flag.clean    { color: #2DD4BF; border-color: rgba(45,212,191,.4); background: rgba(45,212,191,.08); }

  .risk-label-text { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 4px; }
  .risk-label-text.safe   { color: #2DD4BF; }
  .risk-label-text.risky  { color: #FB923C; }
  .risk-label-text.danger { color: #F87171; }

  /* ── Score bar ── */
  .score-bar-wrap { margin-top: 4px; }
  .score-bar-track { height: 5px; border-radius: 99px; background: var(--border2); overflow: hidden; }
  .score-bar-fill { height: 100%; border-radius: 99px; transition: width .4s ease; }
  .score-bar-fill.safe   { background: linear-gradient(90deg, #2DD4BF, #22D3EE); }
  .score-bar-fill.risky  { background: linear-gradient(90deg, #F59E0B, #FB923C); }
  .score-bar-fill.danger { background: linear-gradient(90deg, #FB923C, #F87171); }
  .score-bar-labels { display: flex; justify-content: space-between; font-size: 9px; color: var(--muted); margin-top: 3px; }

  /* ── Summary ── */
  .summary-block { border-top: 1px solid var(--border); padding-top: 18px; }
  .summary-text { font-size: 14px; color: #94A3B8; line-height: 1.75; }
  body.light .summary-text { color: #475569; }

  /* ── Signal chips ── */
  .signals-row { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--border); }
  .signal-chip { display: flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 7px; font-size: 11px; font-weight: 500; border: 1px solid; }
  .signal-chip.crit  { background: rgba(239,68,68,.07);  border-color: rgba(239,68,68,.2);  color: #F87171; }
  .signal-chip.high  { background: rgba(249,115,22,.07); border-color: rgba(249,115,22,.2); color: #FB923C; }
  .signal-chip.low   { background: rgba(245,158,11,.07); border-color: rgba(245,158,11,.2); color: #F59E0B; }
  .signal-chip.info  { background: rgba(96,165,250,.07); border-color: rgba(96,165,250,.2); color: #60A5FA; }
  .signal-chip svg   { flex-shrink: 0; }

  /* ── Meta row ── */
  .meta-row { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }
  .meta-item { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 4px; }
  .meta-item strong { color: #64748B; }

  /* ── Section heading ── */
  .section-head { font-size: 11px; font-weight: 600; letter-spacing: .8px; text-transform: uppercase; color: var(--muted); margin-bottom: 14px; display: flex; align-items: center; gap: 10px; }
  .section-head::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  /* ── Risk items ── */
  .risk-item { background: var(--bg); border: 1px solid var(--border); border-left: 3px solid; border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; transition: background .2s; }
  .risk-item:last-child { margin-bottom: 0; }
  .risk-item.critical { border-left-color: #F87171; }
  .risk-item.high     { border-left-color: #FB923C; }
  .risk-item.low      { border-left-color: #F59E0B; }
  .risk-item.info     { border-left-color: #60A5FA; }

  .item-top { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
  .sev-pill { font-size: 9px; font-weight: 700; padding: 3px 8px; border-radius: 999px; text-transform: uppercase; letter-spacing: .5px; flex-shrink: 0; margin-top: 2px; }
  .sev-pill.critical { background: rgba(239,68,68,.15);  color: #F87171; }
  .sev-pill.high     { background: rgba(249,115,22,.15); color: #FB923C; }
  .sev-pill.low      { background: rgba(245,158,11,.15); color: #F59E0B; }
  .sev-pill.info     { background: rgba(96,165,250,.15); color: #60A5FA; }

  .item-title { font-size: 13px; font-weight: 600; color: var(--text); line-height: 1.4; }
  .item-divider { border: none; border-top: 1px solid var(--border); margin: 10px 0; }
  .item-desc { font-size: 13px; color: #94A3B8; line-height: 1.7; }
  body.light .item-desc { color: #475569; }

  /* Error */
  .error-card { background: rgba(239,68,68,.06); border: 1px solid rgba(239,68,68,.25); border-radius: 12px; padding: 16px 20px; color: #F87171; font-size: 14px; margin-top: 20px; }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--dim); border-radius: 2px; }

  /* ── Mobile ── */
  @media (max-width: 600px) {
    nav { padding: 0 16px; gap: 8px; height: 52px; }
    nav .badge { display: none; }
    .hero { margin: 28px auto 20px; padding: 0 16px; }
    .hero h1 { font-size: 22px; }
    .main { padding: 0 16px 60px; }
    .card { padding: 16px; border-radius: 12px; }
    .score-card { padding: 16px; }
    .score-top { gap: 14px; }
    .score-circle { width: 72px; height: 72px; }
    .score-circle .score-num { font-size: 22px; }
    .score-domain { font-size: 17px; }
    .signals-row { gap: 6px; }
    .signal-chip { font-size: 10px; padding: 3px 8px; }
    .item-title { font-size: 12px; }
    .item-desc { font-size: 12px; }
    .summary-text { font-size: 13px; }
    .meta-row { gap: 10px; }
  }
</style>
</head>
<body>

<nav>
  <img class="logo" src="logo.png" alt="AVE">
  <div class="brand"><span>AVE</span> Security</div>
  <span class="badge">Beta</span>
  <div class="spacer"></div>
  <button class="nav-btn" id="lang-btn" onclick="toggleLang()">中文</button>
  <button class="nav-btn icon-btn" id="theme-btn" onclick="toggleTheme()" title="Toggle theme"></button>
</nav>

<div class="hero" id="hero" style="display:none">
  <div class="hero-label" id="hero-label">Security Report</div>
  <h1><span class="grad" id="hero-domain-text"></span></h1>
</div>

<div class="main">
  <div id="result"></div>
</div>

<script>
const SUN_SVG  = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>`;
const MOON_SVG = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>`;

const LANGS = {
  en: {
    heroLabel:   'Security Report',
    noRisk:      'No risk items detected.',
    blacklisted: 'Blacklisted:',
    riskSignal:  n => `${n} risk signal${n !== 1 ? 's' : ''} detected`,
    riskSection: n => `Risk Signals (${n})`,
    riskLabel:   { safe: 'Normal', risky: 'High Risk', danger: 'Critical' },
    phishing:    '⚠ Phishing',
    scam:        '⚠ Scam',
    clean:       '✓ Clean',
    langSwitch:  '中文',
    noKeyword:   'No domain specified. Pass <code>?keyword=example.com</code> in the URL.',
    loading:     'Loading…',
    severity:    { critical: 'Critical', high: 'High', low: 'Low', info: 'Info' },
    scoreNormal: 'Normal',
    scoreRisky:  'Risky',
  },
  zh: {
    heroLabel:   '安全报告',
    noRisk:      '未检测到风险项目。',
    blacklisted: '黑名单：',
    riskSignal:  n => `检测到 ${n} 个风险信号`,
    riskSection: n => `风险信号 (${n})`,
    riskLabel:   { safe: '正常', risky: '高风险', danger: '严重' },
    phishing:    '⚠ 钓鱼攻击',
    scam:        '⚠ 诈骗',
    clean:       '✓ 安全',
    langSwitch:  'English',
    noKeyword:   '未指定域名，请在 URL 中传入 <code>?keyword=example.com</code>',
    loading:     '加载中…',
    severity:    { critical: '严重', high: '高风险', low: '低风险', info: '信息' },
    scoreNormal: '正常',
    scoreRisky:  '风险',
  },
};

function toScore(data) {
  return { 1: 20, 2: 80, 3: 100 }[data.status] ?? 20;
}

function scoreClass(score) {
  return score <= 20 ? 'safe' : score < 100 ? 'risky' : 'danger';
}

let lang     = localStorage.getItem('lang') || 'en';
let lastData = null;

function applyLang() {
  const t = LANGS[lang];
  const lbl = document.getElementById('hero-label');
  if (lbl) lbl.textContent = t.heroLabel;
  document.getElementById('lang-btn').textContent = t.langSwitch;
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
}

function toggleLang() {
  lang = lang === 'en' ? 'zh' : 'en';
  localStorage.setItem('lang', lang);
  applyLang();
  if (lastData) renderResult(lastData);
}

function toggleTheme() {
  const isLight = document.body.classList.toggle('light');
  localStorage.setItem('theme', isLight ? 'light' : 'dark');
  document.getElementById('theme-btn').innerHTML = isLight ? MOON_SVG : SUN_SVG;
}

(function init() {
  // Read auth from URL params and store to localStorage
  const urlAuth = new URLSearchParams(window.location.search).get('auth');
  if (urlAuth) localStorage.setItem('auth', urlAuth);

  if (localStorage.getItem('theme') === 'light') {
    document.body.classList.add('light');
    document.getElementById('theme-btn').innerHTML = MOON_SVG;
  } else {
    document.getElementById('theme-btn').innerHTML = SUN_SVG;
  }
  applyLang();
  loadFromKeyword();
})();

async function loadFromKeyword() {
  const keyword = new URLSearchParams(window.location.search).get('keyword');
  const result  = document.getElementById('result');
  const t       = LANGS[lang];

  if (!keyword) {
    result.style.display = 'block';
    result.innerHTML = `<div class="no-keyword">${t.noKeyword}</div>`;
    return;
  }

  const domain = keyword.replace(/^https?:\/\//i, '').split('/')[0];

  document.getElementById('hero').style.display = 'block';
  document.getElementById('hero-domain-text').textContent = domain;
  document.title = `${domain} — AVE Security`;

  result.style.display = 'block';
  result.innerHTML = `<div style="text-align:center;padding:48px 0;color:var(--muted);font-size:14px"><span class="spinner" style="border-color:rgba(139,92,246,.25);border-top-color:#8B5CF6"></span>${t.loading}</div>`;

  try {
    const auth = localStorage.getItem('auth');
    const config = auth ? { headers: { 'X-Auth': auth } } : {};
    const resp = await fetch(
      `https://h5.phaetd4l.com/v2api/token/v1/dapp/security?keyword=${encodeURIComponent(domain)}`,
      config
    );
    if (!resp.ok) {
      result.innerHTML = `<div class="error-card">Request failed (${resp.status})</div>`;
      return;
    }
    const json = await resp.json();
    if (json.status !== 1 || !json.data) {
      result.innerHTML = `<div class="error-card">${esc(json.msg || 'Unknown error')}</div>`;
      return;
    }
    const scan = json.data.security_scan ?? json.data;
    renderResult({ ...scan, status: json.data.status, domain, updated_at: scan.scanned_at });
  } catch(e) {
    result.innerHTML = `<div class="error-card">${esc(e.message)}</div>`;
  }
}

const SEV_ICON = {
  critical: `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`,
  high:     `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`,
  low:      `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`,
  info:     `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>`,
};

function sevToChipClass(s) {
  return { critical: 'crit', high: 'high', low: 'low', info: 'info' }[s] || 'info';
}

function renderResult(data) {
  lastData = data;
  const t     = LANGS[lang];
  document.getElementById('hero-label').textContent = t.heroLabel;

  const items  = data.risk_items ?? [];
  const score  = toScore(data);
  const sc     = scoreClass(score);
  const rlabel = t.riskLabel[sc] ?? '';
  const div    = document.getElementById('result');

  const flagHtml = data.is_phishing
    ? `<span class="flag phishing">${t.phishing}</span>`
    : data.is_scam
    ? `<span class="flag scam">${t.scam}</span>`
    : `<span class="flag clean">${t.clean}</span>`;

  const chips = items.slice(0, 6).map(item => {
    const label = lang === 'zh' ? (item.risk_item_zh || item.risk_item) : item.risk_item;
    return `<span class="signal-chip ${sevToChipClass(item.severity)}">${SEV_ICON[item.severity] || ''}${esc(label)}</span>`;
  }).join('');

  const itemsHtml = items.length === 0
    ? `<p style="color:var(--muted);font-size:13px">${t.noRisk}</p>`
    : items.map(item => {
        const title = lang === 'zh' ? (item.risk_item_zh || item.risk_item) : item.risk_item;
        const desc  = lang === 'zh' ? (item.description_zh || item.description) : item.description;
        const sevLabel = t.severity[item.severity] || item.severity;
        return `
      <div class="risk-item ${esc(item.severity)}">
        <div class="item-top">
          <span class="sev-pill ${esc(item.severity)}">${esc(sevLabel)}</span>
          <div class="item-title">${esc(title)}</div>
        </div>
        <hr class="item-divider">
        <div class="item-desc">${esc(desc)}</div>
      </div>`;
      }).join('');

  const locale    = lang === 'zh' ? 'zh-CN' : 'en-GB';
  const _ts       = data.updated_at ? new Date(data.updated_at) : null;
  const updatedAt = (_ts && !isNaN(_ts)) ? _ts.toLocaleString(locale, { dateStyle: 'medium', timeStyle: 'short' }) : '—';
  const summary   = lang === 'zh' ? (data.summary_zh || data.summary || '') : (data.summary || '');

  div.style.display = 'block';
  div.innerHTML = `
    <div class="card score-card">
      <div class="score-top">
        <div class="score-circle ${sc}">
          <span class="score-num">${score}</span>
          <span class="score-label">/100</span>
        </div>
        <div class="score-meta">
          <div class="risk-label-text ${sc}">${esc(rlabel)}</div>
          <div class="score-domain">${esc(data.domain)}</div>
          <div class="score-flags">${flagHtml}</div>
          <div class="score-bar-wrap">
            <div class="score-bar-track">
              <div class="score-bar-fill ${sc}" style="width:${score}%"></div>
            </div>
            <div class="score-bar-labels"><span>0 ${t.scoreNormal}</span><span>55</span><span>100 ${t.scoreRisky}</span></div>
          </div>
        </div>
      </div>

      ${summary ? `<div class="summary-block"><div class="summary-text">${esc(summary)}</div></div>` : ''}

      ${chips ? `<div class="signals-row">${chips}</div>` : ''}

      <div class="meta-row">
        <div class="meta-item">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <span>${updatedAt}</span>
        </div>
        ${data.blacklisted !== undefined ? `<div class="meta-item">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          <span>${t.blacklisted} <strong>${data.blacklisted}</strong></span>
        </div>` : ''}
        <div class="meta-item">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
          <span>${t.riskSignal(items.length)}</span>
        </div>
      </div>
    </div>

    ${items.length > 0 ? `
    <div class="card">
      <div class="section-head">${t.riskSection(items.length)}</div>
      ${itemsHtml}
    </div>` : ''}
  `;
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
